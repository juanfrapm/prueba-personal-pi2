; =============================================================================
; PI2 2026 — configuración de compilación
;
; Este archivo se lee en clase. Cada sección está comentada a propósito.
;
; Hay tres entornos:
;   esp32dev   -> ESP32, la placa por defecto del curso
;   nodemcuv2  -> ESP8266 (NodeMCU v2), alternativa soportada
;   native     -> compila en tu PC, sin placa, para correr los tests
;
; Se elige con -e:  pio run -e esp32dev  /  pio test -e native
; =============================================================================

[platformio]
; Si no pasás -e, se usa este. La placa por defecto del curso es la ESP32.
default_envs = esp32dev


; -----------------------------------------------------------------------------
; [env] — lo común a los entornos de placa.
; PlatformIO copia estas opciones a TODOS los entornos; el entorno native de
; más abajo desactiva a mano las que no le sirven.
; -----------------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200

; Corre ANTES de compilar (pre:). Lee secrets.ini y pasa cada valor al
; compilador como macro -D. Por eso el firmware no tiene ni un secreto escrito.
extra_scripts = pre:scripts/inject_secrets.py

; Dependencias con versión fijada por rango menor (^): acepta correcciones
; (7.4.3 -> 7.4.9) pero nunca un cambio mayor que rompa la compilación.
; Sin fijar, un día el build anda y al otro no, y nadie tocó nada.
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.3

; PlatformIO agrega include/ a la ruta de búsqueda de src/, pero NO a la de
; las librerías de lib/. Como lib/conexion y lib/diagnostico necesitan
; config.h, se agrega a mano. Sin esta línea el build falla con
; "fatal error: config.h: No such file or directory".
build_flags = -Iinclude


; -----------------------------------------------------------------------------
; ESP32 — placa por defecto del curso.
;
; Se usa la plataforma de pioarduino, NO el espressif32 oficial de PlatformIO:
; ese quedó congelado en el core Arduino 2.x. pioarduino sigue los cores 3.x.
;
; La URL apunta a un release CONCRETO (55.03.311 = Arduino 3.3.11 sobre
; ESP-IDF 5.5.5), no al alias /stable/. El alias es un tag móvil: apunta al
; último release estable, así que cambia solo. Un equipo que clone hoy y otro
; que clone en noviembre compilarían con compiladores distintos sin haber
; tocado una línea, y el clásico "en mi máquina anda" pasaría a ser literal.
; Fijar la versión es la misma regla que aplicamos a lib_deps, y es lo que
; hace que el repositorio sea reproducible.
;
; Para actualizar: mirá los releases en
; https://github.com/pioarduino/platform-espressif32/releases, cambiá el tag
; de la URL, verificá que compila, y anotalo en docs/decisiones.md.
; -----------------------------------------------------------------------------
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev

; Tabla de particiones con más espacio para la aplicación.
;
; La de fábrica (default.csv) reparte los 4 MB de flash así: 1,25 MB para la
; app, otros 1,25 MB para la copia OTA, y 1,4 MB de SPIFFS. Solo el firmware
; de ejemplo de este template ya ocupa el 71 % de esos 1,25 MB, y todavía
; falta agregar los sensores, las librerías y la lógica de cada equipo. El
; techo se choca en mitad del semestre y el error de linker no dice "te
; quedaste sin espacio" de forma obvia.
;
; min_spiffs.csv sube la app a 1,875 MB (+50 %) achicando el SPIFFS a 128 KB.
; Este proyecto no usa SPIFFS: la configuración llega por macros al compilar
; y por atributos compartidos de ThingsBoard, no por archivos en la placa.
;
; Se mantienen LAS DOS particiones de app (app0/ota_0 y app1/ota_1), o sea que
; la actualización OTA sigue siendo posible. Por eso NO se usa huge_app.csv:
; da todavía más espacio, pero elimina app1 y con ella el OTA.
board_build.partitions = min_spiffs.csv


; -----------------------------------------------------------------------------
; ESP8266 (NodeMCU v2) — entorno secundario.
; Acá sí se usa la plataforma oficial de PlatformIO, que está al día.
; -----------------------------------------------------------------------------
[env:nodemcuv2]
platform = espressif8266@^4.2.1
board = nodemcuv2


; -----------------------------------------------------------------------------
; native — tests de lógica en tu PC, sin placa conectada.
;
; Compila lib/control/ con el compilador de tu máquina y corre test/ con Unity.
; Es lo que permite tener tests de verdad: el ciclo es de segundos y no depende
; del hardware.
;
; Las tres líneas vacías de abajo NO son un descuido: anulan lo que se hereda
; de [env]. Sin framework Arduino (no existe en tu PC), sin el script de
; secretos (los tests no usan la red) y sin las librerías de MQTT/JSON.
; -----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
framework =
extra_scripts =
lib_deps =
build_flags = -std=c++17 -Wall
